version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_alquicoches
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_2026
      MYSQL_DATABASE: bd_alquicoches_carriventas
      MYSQL_USER: app_admin
      MYSQL_PASSWORD: app_secure_2026
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0

volumes:
  mysql_data:
